services:
  db:
    image: postgres:16-alpine
    container_name: helpdesk-db
    environment:
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: helpdesk-backend
    environment:
      DATABASE_URL:       ${DB_URL}
      ADMIN_PASSWORD:     ${ADMIN_PWD}
      JWT_SECRET:         ${JWT_SECRET}
      GOOGLE_API_KEY:     ${GOOGLE_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      N8N_WEBHOOK_URL:    ${N8N_WEBHOOK_URL}
      FRONTEND_URL:       ${FRONTEND_URL}
      NODE_ENV:           ${NODE_ENV}
      INDEXER_URL:        ${INDEXER_URL}
      INDEXER_SECRET:     ${INDEXER_SECRET}
      GMAIL_USER:         ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      REPORT_RECIPIENT:   ${REPORT_RECIPIENT}
    volumes:
      - docs_inbox:/app/docs-inbox
      - documents_storage:/app/documents
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: helpdesk-frontend
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: helpdesk-nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    expose:
      - "6333"
      - "6334"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./rag/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    expose:
      - "11434"
    volumes:
      - ./rag/ollama:/root/.ollama
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    expose:
      - "5678"
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/knowledge-base
      - N8N_SECURE_COOKIE=false
      - N8N_ENCRYPTION_KEY=${N8N_SECRET}
      - TZ=Asia/Jakarta
      - N8N_CORS_ALLOWED_ORIGINS=*
    volumes:
      - ./rag/n8n_data:/home/node/.n8n
      - ./knowledge-base:/home/node/knowledge-base
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

  indexer:
    build: ./indexer
    container_name: helpdesk-indexer
    environment:
      QDRANT_URL:      http://qdrant:6333
      BACKEND_URL:     http://backend:8000
      INDEXER_SECRET:  ${INDEXER_SECRET}
      DOCS_INBOX:      /docs-inbox
      COLLECTION_NAME: ${QDRANT_COLLECTION}
      GOOGLE_API_KEY:  ${GOOGLE_API_KEY}
    expose:
      - "5000"
    volumes:
      - docs_inbox:/docs-inbox
    depends_on:
      - qdrant
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  docs_inbox:
  documents_storage:
EOF
