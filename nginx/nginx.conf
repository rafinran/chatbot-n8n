upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;   # terima semua hostname/IP

    # ── Rate limiting ────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=chat:10m   rate=20r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/h;

    # Ukuran maksimum upload (untuk foto defect)
    client_max_body_size 10M;

    # ── Frontend (React) ─────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Auth endpoints ───────────────────────────────────────
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Chat endpoint ────────────────────────────────────────
    location /api/chat {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Admin document upload ────────────────────────────────
    location /api/admin/documents {
        limit_req zone=upload burst=2 nodelay;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Backend API (fallback) ───────────────────────────────
    location /api {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Health check Nginx ───────────────────────────────────
    location /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}